# Local backing services for the platform, matching ../part-1-platform/.env.example.
# Started by `npm run dev:stack`; nothing here is ever deployed.
name: darkview-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: darkview
      POSTGRES_PASSWORD: darkview
      POSTGRES_DB: darkview
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates darkview_test for test:integration.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkview -d darkview"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible capture storage. SeaweedFS, since MinIO stopped publishing images.
  storage:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - storage-data:/data
      # The platform's S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY, local-only.
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage-bucket:
    image: chrislusf/seaweedfs
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "echo s3.bucket.list | weed shell -master=storage:9333 | grep -q darkview-captures ||
             echo 's3.bucket.create -name darkview-captures' | weed shell -master=storage:9333"
    restart: "no"

volumes:
  postgres-data:
  storage-data:
