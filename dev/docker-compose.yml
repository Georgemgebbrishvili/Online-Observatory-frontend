# Local backing services for the platform, matching ../part-1-platform/.env.example.
# Started by `npm run dev:stack`; nothing here is ever deployed.
name: darkview-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: darkview
      POSTGRES_PASSWORD: darkview
      POSTGRES_DB: darkview
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty volume: creates darkview_test for test:integration.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkview -d darkview"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: darkview-dev
      MINIO_ROOT_PASSWORD: darkview-dev-only
      # The platform signs for S3_REGION=eu-central-1.
      MINIO_SITE_REGION: eu-central-1
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 darkview-dev darkview-dev-only &&
             mc mb --ignore-existing local/darkview-captures"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
