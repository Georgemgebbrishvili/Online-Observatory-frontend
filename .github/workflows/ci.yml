name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # packages/contracts/openapi.yaml is a pinned copy of the platform contract.
      # This fails the build if a committed generated artifact no longer matches it.
      - name: Contract drift
        run: npm run contracts:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # A named breakpoint that reaches the browser unresolved is dead CSS with no
      # error and no warning. This is the only thing that catches it.
      - name: Breakpoints resolved
        run: npm run css:check

  # packages/contracts/SOURCE.json names the platform commit the pinned spec was
  # copied from. This fetches exactly that commit and fails unless the spec is
  # byte-for-byte the same, so the pin cannot claim a release it is not.
  contract-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pinned contract matches its platform commit
        run: |
          commit=$(jq -r .commit packages/contracts/SOURCE.json)
          git init --quiet "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" fetch --quiet --depth 1 \
            https://github.com/Bekatsertsvadzee/Online-Observatory "$commit"
          git -C "$RUNNER_TEMP/platform" show "FETCH_HEAD:contracts/openapi.yaml" \
            > "$RUNNER_TEMP/openapi.yaml"
          cmp "$RUNNER_TEMP/openapi.yaml" packages/contracts/openapi.yaml
          echo "packages/contracts/openapi.yaml is byte-identical to $commit"

  # Against e2e/fake-platform.mjs. operator-evidence and operator-records are left
  # out: they write docs/evidence and are run by hand.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The config drives channel "chrome", not the bundled chromium.
      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      - name: End-to-end
        working-directory: apps/web
        run: npx playwright test --project=setup --project=warm --project=chromium --project=operator --project=signed-out

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
